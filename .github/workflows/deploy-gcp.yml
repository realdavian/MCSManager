name: Deploy to GCP VM

on:
  push:
    branches:
      - master
      - feat/remote-storage-backup # Remove this later if you only want master deployments

env:
  GAR_LOCATION: asia-southeast1 
  REPOSITORY: mcsmanager-repo
  IMAGE_WEB: mcsmanager-web
  IMAGE_DAEMON: mcsmanager-daemon

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SA_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Ensure VM is running
        run: |
          STATUS=$(gcloud compute instances describe minecraft-host --zone=asia-southeast1-a --format='get(status)')
          if [ "$STATUS" != "RUNNING" ]; then
            echo "VM is $STATUS. Starting it up..."
            gcloud compute instances start minecraft-host --zone=asia-southeast1-a
            echo "VM started successfully. It will boot during the docker build process."
          else
            echo "VM is already running."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile/web.dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Daemon Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile/daemon.dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_DAEMON }}:latest
          cache-from: type=gha,scope=daemon
          cache-to: type=gha,mode=max,scope=daemon

      - name: Get current VM IP
        id: get-ip
        run: |
          IP=$(gcloud compute instances describe minecraft-host \
            --zone=asia-southeast1-a \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "VM_IP=$IP" >> $GITHUB_ENV

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            # Set the image URL variable
            IMAGE_WEB_URL=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_WEB }}:latest
            IMAGE_DAEMON_URL=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_DAEMON }}:latest
            
            # Authenticate docker to GAR 
            gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
            
            echo "Pulling latest images from Artifact Registry..."
            sudo docker pull $IMAGE_WEB_URL
            sudo docker pull $IMAGE_DAEMON_URL
            
            echo "Stopping currently running applications..."
            sudo docker stop mcsmanager-web || true
            sudo docker rm mcsmanager-web || true
            sudo docker stop mcsmanager-daemon || true
            sudo docker rm mcsmanager-daemon || true
            
            echo "Starting Web container..."
            sudo docker run -d \
              --name mcsmanager-web \
              --restart unless-stopped \
              -p 23333:23333 \
              -v /etc/localtime:/etc/localtime:ro \
              -v /opt/mcsmanager/web/data:/opt/mcsmanager/web/data \
              -v /opt/mcsmanager/web/logs:/opt/mcsmanager/web/logs \
              $IMAGE_WEB_URL

            echo "Starting Daemon container..."
            sudo docker run -d \
              --name mcsmanager-daemon \
              --restart unless-stopped \
              --network host \
              -e MCSM_DOCKER_WORKSPACE_PATH=/opt/mcsmanager/daemon/data/InstanceData \
              -v /etc/localtime:/etc/localtime:ro \
              -v /opt/mcsmanager/daemon/data:/opt/mcsmanager/daemon/data \
              -v /opt/mcsmanager/daemon/logs:/opt/mcsmanager/daemon/logs \
              -v /var/run/docker.sock:/var/run/docker.sock \
              $IMAGE_DAEMON_URL
